<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Урок — {{ teacher_name }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6fb;
      color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #3c63d8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      border-radius: 20px;
      padding: 4px 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #666;
      margin-bottom: 28px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      text-align: left;
      margin-bottom: 28px;
    }

    .info-item {
      background: #f8f9ff;
      border-radius: 10px;
      padding: 12px 16px;
    }

    .info-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 15px;
      font-weight: 600;
    }

    .room-id {
      background: #f8f9ff;
      border-radius: 10px;
      padding: 12px 16px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      color: #444;
      word-break: break-all;
      margin-bottom: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e6faf0;
      color: #1a7a4a;
      border-radius: 20px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">
      {% if lesson_type == "student" %}Индивидуальный урок{% else %}Групповой урок{% endif %}
    </span>

    <h1>Урок с {{ teacher_name }}</h1>
    <p class="subtitle">Участник: <strong>{{ target_name }}</strong></p>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Учитель</div>
        <div class="info-value">{{ teacher_name }}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Формат</div>
        <div class="info-value">
          {% if lesson_type == "student" %}Один на один{% else %}Группа{% endif %}
        </div>
      </div>
    </div>

    <div class="info-label" style="margin-bottom:6px;">ID комнаты</div>
    <div class="room-id">{{ room_id }}</div>

    <div class="status">
      <span class="dot"></span>
      Урок идёт
    </div>
  </div>
</body>
</html>
