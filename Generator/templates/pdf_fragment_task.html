{# Один номер варианта для PDF. full_width=True — задание с большой таблицей (вне двух колонок). #}
<div class="task{% if item.start_new_page %} pdf-start-new-page{% endif %}{% if item.subdivision == 'geom' %} task-geom{% endif %}{% if full_width %} task-pdf-full-width{% endif %}">

    <div class="task-main">
    <div class="ta">
        <span class="ta-inner">{{ item.order }}</span>
    </div>

    <div class="task-body">
        <div class="task-with-answer">
        {% if item.text %}{{ item.text|safe }}{% else %}<p>&nbsp;</p>{% endif %}

        {% if item.file_url %}
        <div class="task-file-download">
            <a href="{{ item.file_url }}" class="pdf-file-link" target="_blank">Скачать файл</a>
        </div>
        {% endif %}

        <div class="answer-line">
            Ответ: <span class="answer-field">&nbsp;</span>
        </div>
        </div>
    </div>
    </div>

</div>
