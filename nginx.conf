server {
    listen 80;
    server_name lk.genurok.tw1.ru;

    # Django-маршруты
    location ~ ^/(login|logout|register|admin|settings|api|media)(/|$) {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Статика: отдаёт WhiteNoise из Django/Daphne (STATIC_ROOT), путь на диске сервера не важен
    location /static/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA — все остальные пути отдаём index.html
    location / {
        root  /opt/lk_generator_test/frontend/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
