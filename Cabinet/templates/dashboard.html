<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <title>Дашборд</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #F5F6FB; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Unbounded', sans-serif; }
    .card { background: #fff; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 4px 32px rgba(75,101,245,.10); max-width: 400px; width: 100%; }
    h1 { font-size: 20px; color: #0F1733; margin-bottom: 8px; }
    p  { font-size: 13px; color: #9CA3AF; margin-bottom: 24px; }
    a  { display: inline-block; padding: 10px 24px; background: #4B65F5; color: #fff; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; }
    a:hover { background: #3550E0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Привет, {{ request.user.first_name|default:request.user.username }}! 👋</h1>
    <p>Вы успешно вошли в систему{% if profile %} как <strong>{{ profile.get_role_display }}</strong>{% endif %}.</p>
    <a href="{% url 'logout' %}">Выйти</a>
  </div>
</body>
</html>
