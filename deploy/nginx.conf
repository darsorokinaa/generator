server {
    listen 80;
    server_name genurok.tw1.ru;

    client_max_body_size 50M;

    location /assets/ {
        alias /opt/generator_test/frontend/dist/assets/;
        access_log off;
        expires 30d;
    }

    location /img/ {
        alias /opt/generator_test/frontend/dist/img/;
        access_log off;
        expires 30d;
    }

    location /static/assets/ {
        alias /opt/generator_test/frontend/dist/assets/;
        access_log off;
        expires 30d;
    }

    location /static/favicon.svg {
        alias /opt/generator_test/frontend/dist/favicon.svg;
        access_log off;
        expires 30d;
    }

    location /static/ {
        alias /opt/generator_test/Generator/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/generator_test/Generator/media/;
    }

    # API, admin, lesson — всё на Django напрямую
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lesson/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA — React catch-all через Django (HTML оболочки не кэшируем — иначе после деплоя остаётся старый бандл)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
