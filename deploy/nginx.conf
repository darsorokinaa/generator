server {
    listen 80;
    server_name ВАШ_ДОМЕН.ru www.ВАШ_ДОМЕН.ru;

    client_max_body_size 50M;

    # Статические файлы Django (collectstatic)
    location /static/ {
        alias /opt/generator/Generator/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиафайлы (загруженные картинки к задачам)
    location /media/ {
        alias /opt/generator/Generator/media/;
        expires 7d;
    }

    # Всё остальное → Gunicorn (Django)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
